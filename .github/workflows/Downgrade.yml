name: Downgrade
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        group:
          - Core
          - AD
          - Enzyme
    uses: "SciML/.github/.github/workflows/downgrade.yml@v1"
    with:
      julia-version: "lts"
      group: "${{ matrix.group }}"
    secrets: "inherit"
